<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutas Quisqueyanas</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fa;
color:#222;
}

.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover no-repeat;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero h2{
font-size:50px;
margin-bottom:20px;
}

.categories span{
margin:15px;
cursor:pointer;
font-weight:600;
font-size:20px;
text-decoration:underline;
}

.section{
padding:80px 40px;
display:none;
}

.section h2{
text-align:center;
margin-bottom:40px;
font-size:32px;
color:#0a1f44;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
}
</style>
</head>

<body>

<section class="hero">
<h2>Explore the Dominican Republic</h2>

<div class="categories">
<span onclick="showSection('beaches')">Beaches</span>
<span onclick="showSection('culture')">Culture</span>
<span onclick="showSection('luxury')">Luxury</span>
<span onclick="showSection('adventure')">Adventure</span>
</div>
</section>

<!-- BEACHES -->
<section id="beaches" class="section">
<h2>Top Beaches in Dominican Republic</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
<img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21">
<img src="https://images.unsplash.com/photo-1526779259212-756e6d0bca91">
</div>
</section>

<!-- CULTURE -->
<section id="culture" class="section">
<h2>Historical & Cultural Sites</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
<img src="https://images.unsplash.com/photo-1526481280691-3f8f6c88b31f">
<img src="https://images.unsplash.com/photo-1504196606672-aef5c9cefc92">
</div>
</section>

<!-- LUXURY -->
<section id="luxury" class="section">
<h2>Luxury Hotels & Resorts</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1566073771259-6a8506099945">
<img src="https://images.unsplash.com/photo-1551882547-ff40c63fe5fa">
<img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb">
</div>
</section>

<!-- ADVENTURE -->
<section id="adventure" class="section">
<h2>Adventure & Excursions</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e">
</div>
</section>

<script>

function showSection(sectionId){

// Ocultar todas
document.querySelectorAll('.section').forEach(sec=>{
sec.style.display = "none";
});

// Mostrar la seleccionada
document.getElementById(sectionId).style.display = "block";

// Scroll suave hacia la sección
document.getElementById(sectionId).scrollIntoView({behavior:'smooth'});

}

</script>

</body>
</html>
