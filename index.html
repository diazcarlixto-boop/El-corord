<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutas Quisqueyanas | Dominican Republic Travel Experts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f4f8fb;
color:#222;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
width:100%;
background:#002855;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.navbar h1{
color:white;
font-size:22px;
}

.navbar ul{
list-style:none;
display:flex;
gap:25px;
}

.navbar a{
color:white;
text-decoration:none;
font-weight:500;
}

/* HERO */
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600') center/cover no-repeat;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:white;
padding-top:60px;
}

.hero h2{
font-size:55px;
margin-bottom:20px;
text-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.btn-main{
background:#d00000;
color:white;
padding:14px 30px;
border-radius:8px;
font-weight:700;
text-decoration:none;
}

/* SECTIONS */
section{
padding:100px 40px;
}

h2{
text-align:center;
margin-bottom:50px;
font-size:36px;
color:#002855;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.4s;
cursor:pointer;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.card-content{
padding:25px;
}

.price{
font-weight:700;
margin:10px 0;
color:#d00000;
}

/* MODAL */
.modal{
display:none;
position:fixed;
z-index:2000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
padding:30px;
border-radius:20px;
max-width:600px;
width:100%;
position:relative;
}

.modal img{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

.modal h3{
margin-bottom:10px;
}

.modal p{
margin-bottom:15px;
}

.modal input{
width:100%;
padding:10px;
margin-bottom:12px;
border-radius:6px;
border:1px solid #ccc;
}

.reserve-btn{
background:#25D366;
color:white;
padding:12px;
width:100%;
border:none;
border-radius:6px;
font-weight:600;
cursor:pointer;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:25px;
cursor:pointer;
}

/* WHATSAPP FLOAT */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 20px;
border-radius:50px;
font-weight:600;
text-decoration:none;
}

/* FOOTER */
footer{
background:#001d3d;
color:white;
text-align:center;
padding:30px;
}
</style>
</head>

<body>

<div class="navbar">
<h1>Rutas Quisqueyanas 🇩🇴</h1>
<ul>
<li><a href="#luxury">Luxury</a></li>
<li><a href="#history">History</a></li>
<li><a href="#nature">Nature</a></li>
</ul>
</div>

<section class="hero">
<h2>Experience the Authentic Dominican Republic</h2>
<a class="btn-main" href="#luxury">Explore Tours</a>
</section>

<section id="luxury">
<h2>Luxury Caribbean Destinations</h2>
<div class="grid">

<div class="card" onclick="openModal('Punta Cana Luxury Experience','US$129 per person','https://images.unsplash.com/photo-1507525428034-b723cf961d3e')">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
<div class="card-content">
<h3>Punta Cana</h3>
<p class="price">US$129 per person</p>
</div>
</div>

<div class="card" onclick="openModal('Samaná & Cayo Levantado','US$149 per person','https://images.unsplash.com/photo-1537996194471-e657df975ab4')">
<img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4">
<div class="card-content">
<h3>Samaná</h3>
<p class="price">US$149 per person</p>
</div>
</div>

</div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<img id="modalImg">
<h3 id="modalTitle"></h3>
<p id="modalPrice"></p>

<input type="text" id="clientName" placeholder="Your Name">
<input type="date" id="tourDate">
<input type="number" id="peopleCount" placeholder="Number of People">

<button class="reserve-btn" onclick="sendWhatsApp()">Reserve via WhatsApp</button>

</div>
</div>

<a class="whatsapp" href="https://wa.me/18493425653" target="_blank">Chat on WhatsApp</a>

<footer>
© 2026 Rutas Quisqueyanas – Dominican Republic Travel Experts 🇩🇴
</footer>

<script>
let selectedTour = "";

function openModal(title,price,img){
document.getElementById("modal").style.display="flex";
document.getElementById("modalTitle").innerText=title;
document.getElementById("modalPrice").innerText=price;
document.getElementById("modalImg").src=img;
selectedTour = title + " - " + price;
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function sendWhatsApp(){
let name = document.getElementById("clientName").value;
let date = document.getElementById("tourDate").value;
let people = document.getElementById("peopleCount").value;

if(name === "" || date === "" || people === ""){
alert("Please complete all fields");
return;
}

let message = `Hello, my name is ${name}. I want to book ${selectedTour} for ${people} people on ${date}.`;
let url = "https://wa.me/18493425653?text=" + encodeURIComponent(message);
window.open(url, "_blank");
}
</script>

</body>
</html>
